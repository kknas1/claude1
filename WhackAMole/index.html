<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="두더지잡기">
<meta name="theme-color" content="#0d2611">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>두더지 잡기 - Whack-a-Mole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="version-badge">v1.0.0</div>
  <button id="soundBtn" class="sound-btn" aria-label="사운드 켜기/끄기">🔊</button>

  <div class="game-wrap">
    <header class="hud">
      <div class="hud-item">
        <span class="hud-label">점수</span>
        <span id="score" class="hud-value">0</span>
        <span class="hud-unit">점</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">시간</span>
        <span id="time" class="hud-value">45</span>
        <span class="hud-unit">초</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">최고기록</span>
        <span id="best" class="hud-value">0</span>
        <span class="hud-unit">점</span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="420" height="640"></canvas>

      <div id="overlay" class="overlay">
        <div class="panel">
          <h1>🔨 두더지 잡기</h1>
          <p class="lead">45초 안에 두더지를 최대한 많이 잡으세요!</p>
          <ul class="how">
            <li>🐹 두더지를 <b>탭</b>하면 <b>+10점</b></li>
            <li>✨ 황금 두더지는 <b>+30점</b> (빨리 사라져요)</li>
            <li>💣 폭탄을 누르면 <b>-30점</b>, 조심!</li>
            <li>🔥 연속으로 잡으면 <b>콤보 보너스</b></li>
            <li>❌ 헛스윙하면 콤보가 끊겨요</li>
          </ul>
          <button id="startBtn" class="btn">시작하기</button>
        </div>
      </div>

      <div id="gameover" class="overlay hidden">
        <div class="panel">
          <h1>⏰ 게임 종료!</h1>
          <p class="result">
            <b id="finalScore">0</b>점 ·
            두더지 <b id="finalMoles">0</b>마리
          </p>
          <p id="newRecord" class="record hidden">🏆 신기록!</p>
          <button id="retryBtn" class="btn">다시 도전</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
