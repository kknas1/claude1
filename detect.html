<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Object Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            width: 80px;
            height: 80px;
            border: 3px solid transparent;
            border-top: 3px solid #00f0ff;
            border-right: 3px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
            position: relative;
        }

        .loading-icon::after {
            content: '';
            position: absolute;
            inset: 8px;
            border: 2px solid transparent;
            border-bottom: 2px solid #ff003c;
            border-left: 2px solid #ff003c;
            border-radius: 50%;
            animation: spin 0.6s linear infinite reverse;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-family: 'Orbitron', monospace;
            color: #00f0ff;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        .loading-sub {
            color: #555;
            font-size: 13px;
            margin-top: 12px;
            letter-spacing: 2px;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Camera */
        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Detection Canvas */
        #overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* HUD Top Bar */
        .hud-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hud-title {
            font-family: 'Orbitron', monospace;
            color: #00f0ff;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .hud-fps {
            font-family: 'Orbitron', monospace;
            color: #0f0;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* HUD Bottom */
        .hud-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .detected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .detected-tag {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            animation: tag-in 0.3s ease;
        }

        @keyframes tag-in {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .object-count {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 3px;
        }

        /* Crosshair center */
        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            width: 40px;
            height: 40px;
            pointer-events: none;
        }

        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
        }

        .crosshair::before {
            width: 1px;
            height: 100%;
            left: 50%;
        }

        .crosshair::after {
            height: 1px;
            width: 100%;
            top: 50%;
        }

        /* Scan line effect */
        .scanline {
            position: fixed;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        /* Corner brackets on screen */
        .screen-bracket {
            position: fixed;
            width: 30px;
            height: 30px;
            z-index: 15;
            pointer-events: none;
        }

        .screen-bracket.tl { top: 50px; left: 15px; border-top: 2px solid rgba(0,240,255,0.3); border-left: 2px solid rgba(0,240,255,0.3); }
        .screen-bracket.tr { top: 50px; right: 15px; border-top: 2px solid rgba(0,240,255,0.3); border-right: 2px solid rgba(0,240,255,0.3); }
        .screen-bracket.bl { bottom: 80px; left: 15px; border-bottom: 2px solid rgba(0,240,255,0.3); border-left: 2px solid rgba(0,240,255,0.3); }
        .screen-bracket.br { bottom: 80px; right: 15px; border-bottom: 2px solid rgba(0,240,255,0.3); border-right: 2px solid rgba(0,240,255,0.3); }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-icon"></div>
        <div class="loading-text">Initializing AI</div>
        <div class="loading-sub">Loading COCO-SSD Neural Network...</div>
    </div>

    <!-- Camera Feed -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Detection Overlay -->
    <canvas id="overlay"></canvas>

    <!-- Scan Effect -->
    <div class="scanline"></div>

    <!-- Screen Brackets -->
    <div class="screen-bracket tl"></div>
    <div class="screen-bracket tr"></div>
    <div class="screen-bracket bl"></div>
    <div class="screen-bracket br"></div>

    <!-- Crosshair -->
    <div class="crosshair"></div>

    <!-- HUD Top -->
    <div class="hud-top">
        <div class="hud-title">Object Detect</div>
        <div class="hud-fps" id="fps-display">-- FPS</div>
    </div>

    <!-- HUD Bottom -->
    <div class="hud-bottom">
        <div class="object-count" id="object-count">SCANNING...</div>
        <div class="detected-list" id="detected-list"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const loadingScreen = document.getElementById('loading-screen');
        const fpsDisplay = document.getElementById('fps-display');
        const objectCount = document.getElementById('object-count');
        const detectedList = document.getElementById('detected-list');

        let model = null;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        let animationId = null;

        // Color palette for different object classes
        const classColors = {};
        const palette = [
            '#00f0ff', '#ff003c', '#0fff50', '#ff6600', '#cc00ff',
            '#ffdd00', '#00ff99', '#ff0080', '#00ccff', '#ff4444',
            '#44ff44', '#ff8800', '#8844ff', '#ff44aa', '#44ffcc',
            '#ffaa00', '#0088ff', '#ff2266', '#22ff88', '#aa44ff'
        ];
        let colorIndex = 0;

        function getClassColor(className) {
            if (!classColors[className]) {
                classColors[className] = palette[colorIndex % palette.length];
                colorIndex++;
            }
            return classColors[className];
        }

        // Korean labels for common COCO classes
        const koLabels = {
            'person': '사람', 'bicycle': '자전거', 'car': '자동차', 'motorcycle': '오토바이',
            'airplane': '비행기', 'bus': '버스', 'train': '기차', 'truck': '트럭',
            'boat': '보트', 'traffic light': '신호등', 'fire hydrant': '소화전',
            'stop sign': '정지 표지판', 'parking meter': '주차 미터기', 'bench': '벤치',
            'bird': '새', 'cat': '고양이', 'dog': '강아지', 'horse': '말',
            'sheep': '양', 'cow': '소', 'elephant': '코끼리', 'bear': '곰',
            'zebra': '얼룩말', 'giraffe': '기린', 'backpack': '배낭', 'umbrella': '우산',
            'handbag': '핸드백', 'tie': '넥타이', 'suitcase': '여행가방',
            'frisbee': '프리스비', 'skis': '스키', 'snowboard': '스노보드',
            'sports ball': '공', 'kite': '연', 'baseball bat': '야구 배트',
            'baseball glove': '야구 글러브', 'skateboard': '스케이트보드',
            'surfboard': '서핑보드', 'tennis racket': '테니스 라켓',
            'bottle': '병', 'wine glass': '와인잔', 'cup': '컵', 'fork': '포크',
            'knife': '나이프', 'spoon': '숟가락', 'bowl': '그릇', 'banana': '바나나',
            'apple': '사과', 'sandwich': '샌드위치', 'orange': '오렌지', 'broccoli': '브로콜리',
            'carrot': '당근', 'hot dog': '핫도그', 'pizza': '피자', 'donut': '도넛',
            'cake': '케이크', 'chair': '의자', 'couch': '소파', 'potted plant': '화분',
            'bed': '침대', 'dining table': '식탁', 'toilet': '변기', 'tv': 'TV',
            'laptop': '노트북', 'mouse': '마우스', 'remote': '리모컨',
            'keyboard': '키보드', 'cell phone': '핸드폰', 'microwave': '전자레인지',
            'oven': '오븐', 'toaster': '토스터', 'sink': '싱크대',
            'refrigerator': '냉장고', 'book': '책', 'clock': '시계', 'vase': '꽃병',
            'scissors': '가위', 'teddy bear': '인형', 'hair drier': '드라이어',
            'toothbrush': '칫솔'
        };

        function getLabel(className) {
            return koLabels[className] || className;
        }

        // Smooth box interpolation
        const prevBoxes = new Map();
        const LERP_SPEED = 0.3;

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function smoothBox(id, targetBox) {
            if (prevBoxes.has(id)) {
                const prev = prevBoxes.get(id);
                const smoothed = {
                    x: lerp(prev.x, targetBox.x, LERP_SPEED),
                    y: lerp(prev.y, targetBox.y, LERP_SPEED),
                    w: lerp(prev.w, targetBox.w, LERP_SPEED),
                    h: lerp(prev.h, targetBox.h, LERP_SPEED),
                    age: prev.age + 1
                };
                prevBoxes.set(id, smoothed);
                return smoothed;
            }
            const box = { ...targetBox, age: 0 };
            prevBoxes.set(id, box);
            return box;
        }

        // Draw a single detection box with tech styling
        function drawDetection(prediction, scaleX, scaleY) {
            const [bx, by, bw, bh] = prediction.bbox;
            const x = bx * scaleX;
            const y = by * scaleY;
            const w = bw * scaleX;
            const h = bh * scaleY;

            const id = prediction.class + '_' + Math.round(bx / 50) + '_' + Math.round(by / 50);
            const box = smoothBox(id, { x, y, w, h });

            const color = getClassColor(prediction.class);
            const confidence = Math.round(prediction.score * 100);
            const label = getLabel(prediction.class);
            const cornerLen = Math.min(25, box.w * 0.2, box.h * 0.2);

            // Glow effect
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;

            // Main box (thin)
            ctx.strokeStyle = color + '40';
            ctx.lineWidth = 1;
            ctx.strokeRect(box.x, box.y, box.w, box.h);

            // Corner brackets (thick, the cool part)
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'square';

            // Top-left
            ctx.beginPath();
            ctx.moveTo(box.x, box.y + cornerLen);
            ctx.lineTo(box.x, box.y);
            ctx.lineTo(box.x + cornerLen, box.y);
            ctx.stroke();

            // Top-right
            ctx.beginPath();
            ctx.moveTo(box.x + box.w - cornerLen, box.y);
            ctx.lineTo(box.x + box.w, box.y);
            ctx.lineTo(box.x + box.w, box.y + cornerLen);
            ctx.stroke();

            // Bottom-left
            ctx.beginPath();
            ctx.moveTo(box.x, box.y + box.h - cornerLen);
            ctx.lineTo(box.x, box.y + box.h);
            ctx.lineTo(box.x + cornerLen, box.y + box.h);
            ctx.stroke();

            // Bottom-right
            ctx.beginPath();
            ctx.moveTo(box.x + box.w - cornerLen, box.y + box.h);
            ctx.lineTo(box.x + box.w, box.y + box.h);
            ctx.lineTo(box.x + box.w, box.y + box.h - cornerLen);
            ctx.stroke();

            ctx.shadowBlur = 0;

            // Targeting lines (subtle dashes from corners)
            ctx.strokeStyle = color + '20';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            // Horizontal center line
            ctx.beginPath();
            ctx.moveTo(box.x, box.y + box.h / 2);
            ctx.lineTo(box.x + box.w, box.y + box.h / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Label background
            const labelText = `${label}`;
            const confText = `${confidence}%`;
            ctx.font = '700 14px Rajdhani, sans-serif';
            const labelWidth = ctx.measureText(labelText).width;
            ctx.font = '500 11px Orbitron, monospace';
            const confWidth = ctx.measureText(confText).width;
            const totalWidth = labelWidth + confWidth + 24;
            const labelHeight = 24;
            const labelX = box.x;
            const labelY = box.y - labelHeight - 4;

            // Label bg
            ctx.fillStyle = color + '22';
            ctx.fillRect(labelX, labelY, totalWidth, labelHeight);
            // Label left accent
            ctx.fillStyle = color;
            ctx.fillRect(labelX, labelY, 3, labelHeight);

            // Label text
            ctx.font = '700 14px Rajdhani, sans-serif';
            ctx.fillStyle = '#fff';
            ctx.textBaseline = 'middle';
            ctx.fillText(labelText, labelX + 10, labelY + labelHeight / 2);

            // Confidence
            ctx.font = '500 11px Orbitron, monospace';
            ctx.fillStyle = color;
            ctx.fillText(confText, labelX + labelWidth + 16, labelY + labelHeight / 2);

            // Small dot indicator at top-right of label
            ctx.beginPath();
            ctx.arc(labelX + totalWidth - 6, labelY + 6, 3, 0, Math.PI * 2);
            ctx.fillStyle = confidence > 70 ? '#0f0' : confidence > 40 ? '#ff0' : '#f00';
            ctx.fill();
        }

        // Main detection loop
        async function detect() {
            if (!model) return;

            const predictions = await model.detect(video);

            // Resize canvas
            overlay.width = window.innerWidth;
            overlay.height = window.innerHeight;

            const scaleX = overlay.width / video.videoWidth;
            const scaleY = overlay.height / video.videoHeight;

            ctx.clearRect(0, 0, overlay.width, overlay.height);

            // Draw each detection
            predictions.forEach(pred => {
                if (pred.score > 0.35) {
                    drawDetection(pred, scaleX, scaleY);
                }
            });

            // Update HUD
            const detected = predictions.filter(p => p.score > 0.35);
            const uniqueClasses = [...new Set(detected.map(p => p.class))];

            objectCount.textContent = detected.length > 0
                ? `${detected.length} OBJECT${detected.length > 1 ? 'S' : ''} DETECTED`
                : 'SCANNING...';

            detectedList.innerHTML = uniqueClasses.map(cls => {
                const count = detected.filter(p => p.class === cls).length;
                const color = getClassColor(cls);
                return `<div class="detected-tag" style="border-color:${color}80; color:${color}">
                    ${getLabel(cls)}${count > 1 ? ' ×' + count : ''}
                </div>`;
            }).join('');

            // FPS
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                fpsDisplay.textContent = fps + ' FPS';
            }

            // Clean up old smooth boxes
            const activeIds = new Set();
            detected.forEach(pred => {
                const [bx, by] = pred.bbox;
                activeIds.add(pred.class + '_' + Math.round(bx / 50) + '_' + Math.round(by / 50));
            });
            for (const key of prevBoxes.keys()) {
                if (!activeIds.has(key)) prevBoxes.delete(key);
            }

            animationId = requestAnimationFrame(detect);
        }

        // Initialize
        async function init() {
            try {
                // Start camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                // Load model
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

                // Hide loading
                loadingScreen.classList.add('fade-out');
                setTimeout(() => loadingScreen.style.display = 'none', 800);

                // Start detection
                detect();
            } catch (err) {
                console.error(err);
                document.querySelector('.loading-text').textContent = 'ERROR';
                document.querySelector('.loading-sub').textContent =
                    err.name === 'NotAllowedError'
                        ? '카메라 접근 권한을 허용해주세요'
                        : '카메라를 사용할 수 없습니다: ' + err.message;
                document.querySelector('.loading-icon').style.display = 'none';
            }
        }

        // Handle resize
        window.addEventListener('resize', () => {
            overlay.width = window.innerWidth;
            overlay.height = window.innerHeight;
        });

        init();
    </script>
</body>
</html>
